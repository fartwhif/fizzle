[package]
name = "acetui"
description = "Rust TUI client for ACE (Asheron's Call) servers"
version.workspace = true
edition.workspace = true

[dependencies]
acproto = { path = "../acproto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
